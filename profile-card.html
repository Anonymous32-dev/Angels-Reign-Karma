<style>
:root{
  --bg:#1a1008; --panel:rgba(20,12,6,0.72); --panel-b:rgba(255,255,255,0.1);
  --text:#f2e9df; --sub:#a68f7c; --accent:#e8823a; --accent2:#c4622a;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px); scrollbar-width:none;}
html::-webkit-scrollbar{display:none;}
body{
  margin:0; min-height:100vh; position:relative; overflow-x:hidden;
  scrollbar-width:none;
  background:
    radial-gradient(circle at 20% 10%, rgba(232,130,58,0.1), transparent 40%),
    radial-gradient(circle at 80% 80%, rgba(196,98,42,0.08), transparent 45%),
    var(--bg);
  color:var(--text); font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
  display:flex; justify-content:center; align-items:center; padding:28px 16px;
}
body::-webkit-scrollbar{display:none;}
#bgVideo{
  position:fixed; inset:0; width:100%; height:100%; object-fit:cover; z-index:-1;
  display:none;
}
.sound-btn{
  position:fixed; bottom:18px; right:18px; z-index:5; width:40px; height:40px; border-radius:50%;
  background:rgba(20,12,6,0.85); border:1px solid var(--panel-b); color:var(--accent);
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  box-shadow:0 8px 20px rgba(0,0,0,0.4); backdrop-filter:blur(8px);
}
@keyframes nowPlayingIn{
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1; transform:translateY(0);}
}
.now-playing{
  position:fixed; bottom:18px; left:18px; z-index:5; max-width:230px; text-decoration:none;
  display:flex; align-items:center; gap:9px; padding:9px 14px 9px 9px;
  background:rgba(20,12,6,0.9); border:1px solid var(--accent2); border-radius:999px; color:var(--text);
  box-shadow:0 10px 24px rgba(0,0,0,0.45); backdrop-filter:blur(8px);
  animation:nowPlayingIn .3s ease, floaty 5s ease-in-out infinite .3s;
}
.now-playing .np-icon{
  width:26px; height:26px; border-radius:50%; background:rgba(232,130,58,0.18); color:var(--accent);
  display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0;
}
.now-playing .np-text{display:flex; flex-direction:column; gap:0; min-width:0;}
.now-playing .np-label{font-size:9.5px; color:var(--sub); letter-spacing:.03em;}
.now-playing .np-title{font-size:11.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
@media (prefers-reduced-motion: reduce){
  .now-playing{animation:none;}
}
.wrap{width:100%; max-width:760px; position:relative; z-index:1; margin:auto;}

/* floating Spotify songs (position is set from script.js) */
.float-song{
  position:fixed; z-index:4; width:230px; display:flex; align-items:center; gap:12px;
  padding:10px 14px 10px 10px; text-decoration:none;
  background:rgba(0,0,0,0.6); border:1px solid var(--panel-b); border-radius:16px;
  box-shadow:0 14px 30px rgba(0,0,0,0.5); backdrop-filter:blur(10px);
  animation:floaty 5s ease-in-out infinite;
}
.float-song .sp-art{width:52px; height:52px; border-radius:6px; object-fit:cover; flex-shrink:0; background:#111;}
.float-song .sp-art-empty{display:flex; align-items:center; justify-content:center; font-size:22px;}
.float-song .sp-text{display:flex; flex-direction:column; gap:3px; min-width:0;}
.float-song .sp-title{color:#1ed760; font-weight:700; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.float-song .sp-artist{color:#b3b3b3; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
/* floating photos / videos (position, size and tilt are set from script.js) */
.float-media{
  position:fixed; z-index:4; width:150px; height:110px; border-radius:16px; overflow:hidden;
  border:1px solid var(--panel-b); background:rgba(0,0,0,0.5); pointer-events:none;
  box-shadow:0 14px 30px rgba(0,0,0,0.5);
  animation:floaty 5s ease-in-out infinite;
}
.float-media img, .float-media video{width:100%; height:100%; object-fit:cover; display:block;}
@media (prefers-reduced-motion: reduce){
  .float-media{animation:none;}
}
.now-playing{display:none;}
.sp-player-box{
  position:fixed; bottom:12px; left:50%; transform:translateX(-50%); z-index:6;
  width:min(340px, calc(100vw - 32px)); border-radius:14px; overflow:hidden;
  box-shadow:0 14px 30px rgba(0,0,0,0.55);
}
.sp-player-box iframe{display:block; border:0; border-radius:14px;}
@media (max-width:1100px){
  body.has-player{padding-bottom:108px;}
}
@media (prefers-reduced-motion: reduce){
  .float-song{animation:none;}
}

@keyframes floaty{
  0%{transform:translateY(0px);}
  50%{transform:translateY(-8px);}
  100%{transform:translateY(0px);}
}
.panel{
  position:relative; display:flex; background:var(--panel); border:2px solid var(--panel-b); border-radius:40px;
  backdrop-filter:blur(14px); overflow:hidden;
  box-shadow:0 30px 60px rgba(0,0,0,0.5), 0 2px 0 rgba(255,255,255,0.04) inset;
  animation: floaty 6s ease-in-out infinite;
}
.col-left{flex:1 1 300px; min-width:0; padding:26px 24px; border-right:2px solid var(--panel-b); position:relative; z-index:1;}
.col-right{flex:1 1 320px; min-width:0; padding:26px 24px; position:relative; z-index:1;}
.banner{
  height:82px; border-radius:24px; margin-bottom:-36px; position:relative; overflow:hidden;
  background:linear-gradient(135deg, rgba(232,130,58,.3), rgba(196,98,42,.2));
  background-size:cover; background-position:center;
}
.banner video{width:100%; height:100%; object-fit:cover; display:block;}
.banner .edit-tag{position:absolute; top:6px; right:8px; font-size:9px; color:var(--sub); opacity:0; transition:opacity .15s;}
.banner:hover .edit-tag{opacity:1;}
.identity{position:relative; z-index:2; display:flex; align-items:flex-start; gap:14px; padding:0 4px;}
.avatar{

  display:flex; align-items:center; justify-content:center; font-size:28px; flex-shrink:0;
  overflow:hidden; background-size:cover; background-position:center;
}
.avatar img{width:100%; height:100%; object-fit:cover; border-radius:50%;}
.who{margin-top:40px; min-width:0;}
.name-row{display:flex; align-items:center; gap:6px; font-size:19px; font-weight:600;}
.badge{color:var(--accent); width:18px; height:18px; flex-shrink:0;}
.badge-img{width:18px; height:18px; object-fit:contain; flex-shrink:0;}
.title-row{color:var(--sub); font-size:13px; margin-top:3px; display:flex; align-items:center; gap:8px;}
.title-row .pill{border:1px solid var(--panel-b); border-radius:999px; padding:2px 9px;}
.uid{color:var(--sub); font-size:12px; margin-top:6px;}
.bio{font-size:13px; color:#c3cbd6; line-height:1.55; margin-top:16px;}
.devices{display:flex; margin-top:18px; border-top:1px solid var(--panel-b); padding-top:14px;}
.device{flex:1; text-align:center; color:var(--sub); font-size:11px; border-left:1px solid var(--panel-b);}
.device:first-child{border-left:none;}
.device .ic{font-size:20px; display:block; margin-bottom:4px; color:var(--text);}
.content-box{

}
.content-box video{width:100%; height:100%; object-fit:cover; border-radius:22px;}
.stats{display:flex; gap:10px; margin-top:18px;}
.stat-btn{

  padding:12px; display:flex; align-items:center; justify-content:center; gap:8px;
  font-family:inherit; font-size:14px; color:var(--text); cursor:pointer;
  transition:border-color .15s ease, transform .1s ease;
}
.stat-btn:active{transform:scale(0.97);}
.stat-btn.liked .ic-heart{fill:var(--accent);}
.stat-btn .n{font-weight:600;}
.hint{color:var(--sub); font-size:10.5px; text-align:center; margin-top:8px;}
.tabs{display:flex; gap:4px; background:rgba(0,0,0,0.25); border:1px solid var(--panel-b);

.tab{flex:1; background:none; border:none; color:var(--sub); font-family:inherit; font-size:13px;

.tab.active{color:var(--text); background:rgba(232,130,58,0.16); box-shadow:0 4px 10px rgba(0,0,0,0.25) inset, 0 2px 6px rgba(0,0,0,0.2);}
.tab.active::after{content:none;}
.tab-body{position:relative; overflow:hidden; min-height:260px; border-radius:20px;}
.tab-body-inner{position:relative; z-index:1; background:transparent; border-radius:20px; padding:2px;}
/* image / video backgrounds: behind the whole card and behind each tab */
.panel-bg, .tab-bg{position:absolute; inset:0; z-index:0; pointer-events:none; overflow:hidden;}
.panel-bg img, .panel-bg video, .tab-bg img, .tab-bg video{width:100%; height:100%; object-fit:cover; display:block;}
.panel-bg::after{content:''; position:absolute; inset:0; background:rgba(10,6,3,0.35);}
.tab-bg::after{content:''; position:absolute; inset:0; background:rgba(10,6,3,0.25);}
/* edit mode (open the page with #edit) */
.ed{display:inline-block; min-width:1ch;}
.ed[contenteditable]{outline:1px dashed var(--accent2); outline-offset:3px; border-radius:4px; cursor:text;}
.ed[contenteditable]:focus{outline-style:solid; background:rgba(232,130,58,0.12);}
.ed[contenteditable]:empty::before{content:'(empty)'; color:var(--sub);}
.bio .ed{display:inline;}
.edit-tag-fixed{position:fixed; top:10px; left:10px; z-index:30; font-size:10.5px; color:var(--accent); background:rgba(20,12,6,0.9); border:1px solid var(--accent2); border-radius:999px; padding:5px 11px;}
.edit-btn{margin-left:auto;}
.edit-btn + .del-btn{margin-left:6px;}
.list-item{display:flex; align-items:center; gap:12px; padding:12px 14px; font-size:14px; color:#e6dccf;
  text-decoration:none; background:rgba(255,255,255,0.045); border:1px solid var(--panel-b);
  border-radius:18px; margin-bottom:9px; background-size:cover; background-position:center;
  box-shadow:0 8px 18px rgba(0,0,0,0.3); transition:transform .15s ease, box-shadow .15s ease;}
.list-item:last-child{margin-bottom:0;}
.list-item:hover{transform:translateY(-3px); box-shadow:0 14px 26px rgba(0,0,0,0.4);}
.item-logo{
  width:46px; height:46px; border-radius:13px; background:rgba(255,255,255,0.06);
  border:1px solid var(--panel-b); display:flex; align-items:center; justify-content:center;
  font-size:22px; flex-shrink:0; background-size:cover; background-position:center;
}
.item-text{display:flex; flex-direction:column; gap:1px; min-width:0; flex:1;}
.label-row{display:flex; align-items:center; gap:6px; font-size:14px; font-weight:600;}
.sub-line{font-size:11px; color:var(--sub);}
.list-item.locked{color:var(--sub);}
.open-btn{
  flex-shrink:0; background:rgba(232,130,58,0.12); border:1px solid var(--accent2); color:var(--accent);
  border-radius:999px; padding:6px 13px; font-family:inherit; font-size:11px; white-space:nowrap;
}
.activity-item{display:flex; align-items:center; gap:10px; padding:10px 12px; font-size:13px;
  background:rgba(255,255,255,0.045); border:1px solid var(--panel-b); border-radius:18px; margin-bottom:8px;
  box-shadow:0 8px 18px rgba(0,0,0,0.3);}
.activity-item.media{flex-direction:column; align-items:stretch; padding:10px;}
.activity-item.media .media-preview{
  width:100%; aspect-ratio:4 / 3; border-radius:14px; overflow:hidden; background:rgba(0,0,0,0.3);
}
.activity-item.media .media-preview img, .activity-item.media .media-preview video{
  width:100%; height:100%; object-fit:cover; display:block;
}
.activity-item.media .media-preview{position:relative;}
/* right column media: auto-sized per file, 3 visible, scroll for more */
.media-scroll{position:relative; overflow-y:auto; overflow-x:hidden; padding:2px; overscroll-behavior:contain;
  scrollbar-width:thin; scrollbar-color:rgba(232,130,58,0.55) transparent;}
.media-scroll.scrolls{padding-right:7px;}
.media-scroll::-webkit-scrollbar{width:5px;}
.media-scroll::-webkit-scrollbar-track{background:transparent;}
.media-scroll::-webkit-scrollbar-thumb{background:rgba(232,130,58,0.55); border-radius:99px;}
.media-scroll .activity-item.media .media-preview{max-height:300px;}
.activity-item.media .del-btn{position:absolute; top:8px; right:8px; margin:0; background:rgba(0,0,0,0.6);}
.activity-item.media .media-caption{display:flex; align-items:center; gap:8px; padding:8px 4px 2px;}
.activity-item:last-child{margin-bottom:0;}
.spotify-card{text-decoration:none; background:rgba(0,0,0,0.55); padding:10px 12px; gap:14px; transition:transform .15s ease;}
.spotify-card:hover{transform:translateY(-2px);}
.del-btn{
  margin-left:auto; flex-shrink:0; width:24px; height:24px; border-radius:50%;
  background:rgba(255,255,255,0.08); border:1px solid var(--panel-b); color:var(--sub);

  display:flex; align-items:center; justify-content:center;
}
.del-btn:hover{color:#fff; background:rgba(232,60,60,0.5);}
.sp-art{width:56px; height:56px; border-radius:6px; object-fit:cover; flex-shrink:0; background:#111;}
.sp-art-empty{display:flex; align-items:center; justify-content:center; font-size:22px;}
.sp-text{display:flex; flex-direction:column; gap:3px; min-width:0;}
.sp-title{color:#1ed760; font-weight:700; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.sp-artist{color:#b3b3b3; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.activity-item .meta{color:var(--sub); font-size:11px;}
.add-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; padding:0 6px;}
.add-btn{
  background:rgba(232,130,58,0.1); border:1px solid var(--accent2); color:var(--accent);
  border-radius:999px; padding:7px 13px; font-family:inherit; font-size:11.5px; cursor:pointer;
}
.add-btn:active{transform:scale(0.96);}
@keyframes toastFloat{
  0%{opacity:0; transform:translateY(10px) scale(0.9);}
  15%{opacity:1; transform:translateY(0) scale(1);}
  80%{opacity:1; transform:translateY(-6px) scale(1);}
  100%{opacity:0; transform:translateY(-26px) scale(0.95);}
}
.post-toast{
  position:fixed; z-index:20; pointer-events:none; max-width:180px;
  background:rgba(20,12,6,0.92); border:1px solid var(--accent2); color:var(--text);
  border-radius:14px; padding:9px 13px; font-size:11.5px; display:flex; align-items:center; gap:8px;
  box-shadow:0 12px 26px rgba(0,0,0,0.5); animation:toastFloat 2.6s ease forwards;
}
@media (prefers-reduced-motion: reduce){
  .post-toast{animation:none; opacity:1;}
}
@media (max-width:640px){
  .panel{flex-direction:column;}
  .col-left{border-right:none; border-bottom:2px solid var(--panel-b);}
}
@media (prefers-reduced-motion: reduce){
  .panel{animation:none;}
}
/* Spotify embeds in the Playlist tab and floating beside the card */
.sp-embed{position:relative; margin-bottom:9px;}
.sp-embed:last-child{margin-bottom:0;}
.sp-embed iframe, .float-embed iframe{display:block; width:100%; border:0; border-radius:14px; color-scheme:normal;}
.sp-embed .tools{position:absolute; top:-7px; right:-7px; z-index:2; display:flex; gap:4px;}
.float-embed{padding:0; background:none; border:none; border-radius:14px; backdrop-filter:none; display:block;}
.sp-fallback{color:#1ed760; text-decoration:none; font-size:13px;}

/* tab background fills the whole right column */
.col-right .tabs{position:relative; z-index:1;}
.tab-bg::after{background:rgba(10,6,3,0.3);}

.tab-bg{opacity:0; transition:opacity .25s ease;}
.tab-bg.on{opacity:1;}
</style>
</head>

// ---- image-or-video helpers (used by the card background and every tab background) ----
function isVideoUrl(u){ return /\.(mp4|webm|ogv|ogg|mov|m4v)(\?|#|$)/i.test(u || '') || /^data:video\//i.test(u || ''); }
function mediaHTML(u){
  return isVideoUrl(u)
    ? `<video src="${esc(u)}" autoplay muted loop playsinline></video>`
    : `<img src="${esc(u)}" alt="">`;
}

// ---- background audio: browsers block real autoplay-with-sound, so it starts on first tap ----
if(CONFIG.images.bgAudio){
  const audioEl = document.getElementById('bgAudio');
  const soundBtn = document.getElementById('soundBtn');
  const soundIcon = document.getElementById('soundIcon');
  audioEl.src = CONFIG.images.bgAudio;
  soundBtn.style.display = 'flex';
  let playing = false;

  function setIcon(on){
    soundIcon.innerHTML = on
      ? '<path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a9 9 0 0 1 0 12"/>'
      : '<path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M23 9l-6 6M17 9l6 6"/>';
  }
  setIcon(false);

  function startAudio(){
    audioEl.play().then(()=>{ playing = true; setIcon(true); }).catch(()=>{});
  }
  document.body.addEventListener('click', function first(){
    if(!playing) startAudio();
    document.body.removeEventListener('click', first);
  });
  soundBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    if(playing){ audioEl.pause(); playing = false; setIcon(false); }
    else{ startAudio(); }
  });
}

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ===== shared state (profile + activity posts) now lives in the artifact's db, =====
// ===== so every device shows the same thing instead of each browser's own copy. =====
let db = null, user = null, uid = null, isOwner = false, DATA_READY = false;

let activityPosts = [];

// same Spotify song saved twice -> keep only the newest one
function isMusicPost(p){ return p.label === 'Spotify' || p.label === 'Apple Music'; }
function spotifyKey(p){
  const l = (p.link || p.meta || '').trim().toLowerCase();
  // Apple Music keeps its ?i= (which song inside an album); Spotify ignores the query string
  return p.label === 'Apple Music' ? l : l.split('?')[0];
}
function dedupeSpotify(){
  const seen = new Set();
  const before = activityPosts.length;
  activityPosts = activityPosts.filter(p=>{
    if(!isMusicPost(p)) return true;
    const k = p.label + '|' + spotifyKey(p);
    if(seen.has(k)) return false;
    seen.add(k);
    return true;
  });
  if(activityPosts.length !== before) savePosts();
}

async function savePosts(){
  if(db && isOwner){
    try{ await db.doc('site/activity').set({ posts: activityPosts }); }catch(e){}
  } else if(!db){
    try{ localStorage.setItem('helloworld_activity_posts', JSON.stringify(activityPosts)); }catch(e){}
  }
}

// Owner tools (the + buttons and the × remove buttons) are only shown in edit mode.
// With the shared database connected, edit mode simply follows "is this visitor the
// site owner" - so it turns on for the owner on every device, and never for anyone
// else. Without a database (e.g. previewing the raw file), #edit / #view still work
// as a local-only fallback, same as before.
let EDIT = false;
function localEditFallback(){
  try{
    if(location.hash === '#edit') localStorage.setItem('helloworld_edit', '1');
    if(location.hash === '#view') localStorage.removeItem('helloworld_edit');
    return localStorage.getItem('helloworld_edit') === '1';
  }catch(e){ return location.hash === '#edit'; }
}
window.addEventListener('hashchange', ()=> location.reload());

const PROFILE_KEY = 'helloworld_profile';
let profile = { name:CONFIG.name, title:CONFIG.title, username:CONFIG.username, id:CONFIG.id, bio:CONFIG.bio };

async function saveProfile(){
  if(db && isOwner){
    try{ await db.doc('site/profile').set(profile); }catch(e){}
  } else if(!db){
    try{ localStorage.setItem(PROFILE_KEY, JSON.stringify(profile)); }catch(e){}
  }
}

// Spotify's own compact player (same look as the one at the bottom) - needs no title/cover lookup
function spotifyEmbedUrl(link){
  const u = spotifyUri(link);
  if(!u) return null;
  const [, type, id] = u.split(':');
  return `https://open.spotify.com/embed/${type}/${id}?utm_source=generator&theme=0`;
}
function spotifyEmbedHTML(link, h){
  const src = spotifyEmbedUrl(link);
  return src ? `<iframe src="${src}" height="${h}" loading="lazy" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" title="Spotify player"></iframe>` : '';
}

// ---- Apple Music: Apple's own embed player (no title/cover lookup needed) ----
function isAppleMusicLink(link){ return /^https?:\/\/(geo\.)?music\.apple\.com\//i.test((link || '').trim()); }
function appleEmbedUrl(link){
  if(!isAppleMusicLink(link)) return null;
  try{
    const u = new URL(link.trim());
    u.hostname = 'embed.music.apple.com';
    u.searchParams.set('theme', 'dark');
    return u.toString();
  }catch(e){ return null; }
}
function appleEmbedHeight(link){
  // a single song (a /song/ link, or an album link with ?i=) gets the compact 175px player; albums & playlists get the taller one
  return (/\/song\//.test(link) || /[?&]i=\d+/.test(link)) ? 175 : 450;
}
function appleEmbedHTML(link, h){
  const src = appleEmbedUrl(link);
  return src ? `<iframe src="${src}" height="${h}" loading="lazy" allow="autoplay *; encrypted-media *; fullscreen *; clipboard-write" sandbox="allow-forms allow-popups allow-same-origin allow-scripts allow-storage-access-by-user-activation allow-top-navigation-by-user-activation" title="Apple Music player"></iframe>` : '';
}

function renderPlaylist(){

  const items = songs.length ? songs.map(({a, i})=>{
    const link = a.link || a.meta;

    if(embed){

      return `<div class="sp-embed">${tools}${embed}</div>`;

// ---- right column: images/videos keep their real shape, max 3 visible, scroll for the rest ----
function mediaRatio(w, h){
  // use the file's own width/height, but clamp very tall or very wide ones so they can't dominate the card
  return Math.min(2.2, Math.max(0.7, w / h));
}
function fitMediaScroll(){
  const box = document.getElementById('mediaScroll');
  if(!box) return;
  const items = box.querySelectorAll('.activity-item');
  if(items.length <= 3){
    box.style.maxHeight = '';
    box.classList.remove('scrolls');
    return;
  }
  const third = items[2];
  box.style.maxHeight = (third.offsetTop + third.offsetHeight + 2) + 'px';
  box.classList.add('scrolls');
}
function setupMediaScroll(){
  const box = document.getElementById('mediaScroll');
  if(!box) return;
  box.querySelectorAll('.media-preview').forEach(prev=>{
    const el = prev.querySelector('img, video');
    if(!el) return;
    const apply = (w, h)=>{
      if(!w || !h) return;
      prev.style.aspectRatio = String(mediaRatio(w, h));
      fitMediaScroll();
    };
    if(el.tagName === 'IMG'){
      if(el.complete && el.naturalWidth) apply(el.naturalWidth, el.naturalHeight);
      else el.addEventListener('load', ()=> apply(el.naturalWidth, el.naturalHeight));
    } else {
      if(el.readyState >= 1 && el.videoWidth) apply(el.videoWidth, el.videoHeight);
      else el.addEventListener('loadedmetadata', ()=> apply(el.videoWidth, el.videoHeight));
    }
  });
  fitMediaScroll();
}
window.addEventListener('resize', fitMediaScroll);

// Look up title + cover (+ artist when possible) from a Spotify link
async function fetchSpotifyInfo(link){
  const clean = link.trim().split('?')[0];
  const info = { link: clean, title: '', artist: '', thumb: '' };
  try{
    const r = await fetch('https://open.spotify.com/oembed?url=' + encodeURIComponent(clean));
    if(r.ok){
      const j = await r.json();
      info.title = j.title || '';
      info.thumb = j.thumbnail_url || '';
    }
  }catch(e){}
  // oEmbed has no artist name, so try the page's description (best effort)
  try{
    const r = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(clean));
    if(r.ok){
      const doc = new DOMParser().parseFromString(await r.text(), 'text/html');
      const desc = (doc.querySelector('meta[property="og:description"]') || {}).content || '';
      const parts = desc.split('·').map(p => p.trim()).filter(Boolean)
        .filter(p => p !== info.title && !/^(Song|Single|Album|EP|Playlist|Artist)$/i.test(p) && !/^\d{4}$/.test(p) && !/likes?|saves?|monthly/i.test(p));
      if(parts.length) info.artist = parts[0];
      if(!info.title){
        info.title = ((doc.querySelector('meta[property="og:title"]') || {}).content || '');
      }
      if(!info.thumb){
        info.thumb = ((doc.querySelector('meta[property="og:image"]') || {}).content || '');
      }
    }
  }catch(e){}
  return info;
}

function addActivityPost(icon, label, meta, data, kind, extra){
  if(label === 'Spotify' || label === 'Apple Music'){
    const k = spotifyKey({label, link: (extra && extra.link) || meta});
    activityPosts = activityPosts.filter(p => !(p.label === label && spotifyKey(p) === k));
  }
  activityPosts.unshift(Object.assign({icon, label, meta, data, kind}, extra || {}));
  savePosts();
  renderTab(currentTab);
  if(label === 'Spotify'){
    renderNowPlaying();
  } else {
    renderFloaters();
    spawnPostToast(icon, label);
  }
}

// Floating layer: the latest songs, photos and videos drift at random (but remembered) spots beside the panel
function renderFloaters(){
  document.querySelectorAll('.float-song, .float-media').forEach(el => el.remove());
  const panel = document.querySelector('.panel');
  if(!panel) return;
  const pr = panel.getBoundingClientRect();
  const vw = window.innerWidth, vh = window.innerHeight;
  const bandL = pr.left, bandR = vw - pr.right;
  if(Math.max(bandL, bandR) < 150) return; // screen too narrow: nothing floats

  const items = activityPosts
    .filter(p => isMusicPost(p) || (p.data && (p.kind === 'photo' || p.kind === 'video')))
    .slice(0, 8);
  let seeded = false;
  const placed = [];

  items.forEach(p=>{
    if(p.fx == null){
      p.fx = Math.random(); p.fy = Math.random();
      p.fside = Math.random() < 0.5 ? 0 : 1;
      p.frot = Math.random() * 6 - 3;
      p.fdur = 4 + Math.random() * 3;
      p.fdelay = -Math.random() * 5;
      seeded = true;
    }
    const isSong = isMusicPost(p);
    const h = p.label === 'Apple Music' ? 175 : isSong ? (/\/(playlist|album|show)\//.test(p.link || p.meta || '') ? 152 : 80) : 110;
    const bandOf = side => side === 0 ? bandL : bandR;
    const wOf = side => Math.min(isSong ? 300 : 150, bandOf(side) - 24);
    const yMax = Math.max(12, vh - h - 70);

    let spot = null;
    for(let attempt = 0; attempt < 40 && !spot; attempt++){
      const side = attempt < 20 ? p.fside : 1 - p.fside;
      const w = wOf(side);
      if(w < (isSong ? 240 : 110)) continue;
      const xMin = side === 0 ? 12 : pr.right + 12;
      const xMax = side === 0 ? bandL - w - 12 : vw - w - 12;
      if(xMax < xMin) continue;
      // fallback spots are derived from the saved seed, so the layout stays the same after a refresh
      const rx = (p.fx + attempt * 0.618034) % 1;
      const ry = (p.fy + attempt * 0.381966) % 1;
      const x = xMin + rx * (xMax - xMin);
      const y = 12 + ry * (yMax - 12);
      const clash = placed.some(r => x < r.x + r.w + 10 && x + w + 10 > r.x && y < r.y + r.h + 10 && y + h + 10 > r.y);
      if(!clash) spot = {x, y, w, h};
    }
    if(!spot) return;
    placed.push(spot);

    let el;
    if(isSong){
      el = document.createElement('div');
      el.className = 'float-song float-embed';
      const lk = p.link || p.meta;
      el.innerHTML = (p.label === 'Apple Music' ? appleEmbedHTML(lk, 175) : spotifyEmbedHTML(lk, /\/(playlist|album|show)\//.test(lk) ? 152 : 80)) ||
        `<a class="sp-fallback" href="${esc(lk)}" target="_blank" rel="noopener">🎧 ${esc(p.title || lk)}</a>`;
    } else {
      el = document.createElement('div');
      el.className = 'float-media';
      el.innerHTML = p.kind === 'photo'
        ? `<img src="${p.data}" alt="">`
        : `<video src="${p.data}" muted loop autoplay playsinline></video>`;
    }
    el.style.left = spot.x + 'px';
    el.style.top = spot.y + 'px';
    el.style.width = spot.w + 'px';
    if(!isSong) el.style.height = spot.h + 'px';
    el.style.rotate = p.frot + 'deg';
    el.style.animationDuration = p.fdur + 's';
    el.style.animationDelay = p.fdelay + 's';
    document.body.appendChild(el);
  });
  if(seeded) savePosts();
}

function spawnPostToast(icon, label){
  const corners = [
    {top:'16px', left:'16px'},
    {top:'16px', right:'16px'},
    {bottom:'16px', left:'16px'},
    {bottom:'16px', right:'16px'}
  ];
  const pos = corners[Math.floor(Math.random()*corners.length)];
  const el = document.createElement('div');
  el.className = 'post-toast';
  Object.assign(el.style, pos);
  el.innerHTML = `<span>${icon}</span><span>New ${label} post added</span>`;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2600);
}

// Tab backgrounds are built once and preloaded, then just cross-faded when you switch tabs
// (no re-loading, so the card background underneath never flashes through)
const tabBgLayers = {};
function buildTabBackgrounds(){
  const colRight = document.querySelector('.col-right');
  const map = CONFIG.images.tabBackgrounds || {};
  Object.keys(map).forEach(k=>{
    const url = map[k];
    if(!url) return;
    const layer = document.createElement('div');
    layer.className = 'tab-bg';
    layer.innerHTML = isVideoUrl(url)
      ? `<video src="${esc(url)}" muted loop playsinline preload="auto"></video>`
      : `<img src="${esc(url)}" alt="">`;
    colRight.prepend(layer);
    tabBgLayers[k] = layer;
  });
}
function showTabBackground(key){
  Object.keys(tabBgLayers).forEach(k=>{
    const on = k === key;
    const layer = tabBgLayers[k];
    layer.classList.toggle('on', on);
    const v = layer.querySelector('video');
    if(v){ if(on){ const p = v.play(); if(p && p.catch) p.catch(()=>{}); } else { v.pause(); } }
  });
}

          const appleOk = isPlaylist ? /\/(playlist|album)\//.test(link) : (/\/song\//.test(link) || /[?&]i=\d+/.test(link));
          if(!appleOk){

              ? 'That doesn\'t look like an Apple Music playlist or album link. Use the + Song button for single songs.'

        }
        const kindOk = isPlaylist ? /\/(playlist|album)\//.test(link) : /\/track\//.test(link);
        if(!kindOk){
          alert(isPlaylist
            ? 'That doesn\'t look like a playlist link. Use the + Song button for single songs.'
            : 'That doesn\'t look like a song link. Use the + Playlist button for playlists.');

        } else if(!info.artist && info.title){

          if(typed) info.artist = typed.trim();
        }
        if(!info.title){
          info.title = prompt('Couldn\'t load the info. Type the title:', '') || 'Spotify link';
        }
        info.spType = type;
        spWantPlay = true;
        addActivityPost('🎧', 'Spotify', info.link, null, 'spotify', info);
      });

    });
    }
  }
}

// ---- likes / views: real shared counts (one per signed-in visitor), same database ----
const likeBtn = document.getElementById('likeBtn');
const likeN = document.getElementById('likeN');
const viewN = document.getElementById('viewN');
const statHint = document.getElementById('statHint');
let liked = false;

function paintLike(count){
  likeN.textContent = count;
  likeBtn.classList.toggle('liked', liked);
}

function localStats(){
  statHint.textContent = 'tap the heart to like — counted on this device only';
  let visits = 1;
  try{
    liked = localStorage.getItem('helloworld_liked') === 'true';
    visits = (parseInt(localStorage.getItem('helloworld_visits'), 10) || 0) + 1;
    localStorage.setItem('helloworld_visits', visits);
  }catch(e){}
  paintLike(liked ? 1 : 0);
  viewN.textContent = visits;
  likeBtn.addEventListener('click', ()=>{
    liked = !liked;
    try{ localStorage.setItem('helloworld_liked', liked); }catch(e){}
    paintLike(liked ? 1 : 0);
  });
}

async function initStats(){
  let likeDoc, viewDoc;
  if(!uid){ localStats(); return; }

  async function refreshCounts(){
    const [likesQ, viewsQ] = await Promise.all([
      db.collection('likes').get(),
      db.collection('views').get()
    ]);
    viewN.textContent = viewsQ.size;
    paintLike(likesQ.size);
  }

  try{
    likeDoc = db.doc('likes/' + uid);
    viewDoc = db.doc('views/' + uid);
    liked = (await likeDoc.get()).exists;
    if(!(await viewDoc.get()).exists){ await viewDoc.set({ at: Date.now() }); }
    await refreshCounts();
  }catch(e){ localStats(); return; }

  statHint.textContent = 'tap the heart to like — one like per signed-in visitor, synced everywhere';
  likeBtn.addEventListener('click', async ()=>{
    liked = !liked;
    paintLike(likeN.textContent);
    try{
      if(liked){ await likeDoc.set({ at: Date.now() }); } else { await likeDoc.delete(); }
    }catch(e){ liked = !liked; }
    try{ await refreshCounts(); }catch(e){ paintLike(likeN.textContent); }
  });
}

// ---- boot: connect to the shared database (if this view has it), load the real
// profile/activity/edit state, then render everything that depends on it ----
async function boot(){
  try{ db = await claude.use('db'); }catch(e){}
  try{ user = await claude.use('user'); }catch(e){}
  if(user){
    try{ isOwner = user.isOwner(); }catch(e){ isOwner = false; }
    try{ uid = await user.id(); }catch(e){ uid = null; }
  }

  if(db){
    EDIT = isOwner;
    try{
      const snap = await db.doc('site/profile').get();
      if(snap.exists) Object.assign(profile, snap.data());
    }catch(e){}
    try{
      const snap = await db.doc('site/activity').get();
      if(snap.exists && Array.isArray(snap.data().posts)) activityPosts = snap.data().posts;
    }catch(e){}
  } else {
    EDIT = localEditFallback();
    try{ Object.assign(profile, JSON.parse(localStorage.getItem(PROFILE_KEY)) || {}); }catch(e){}
    try{ activityPosts = JSON.parse(localStorage.getItem('helloworld_activity_posts')) || []; }catch(e){ activityPosts = []; }
  }
  dedupeSpotify();

  renderProfile();
  buildTabBackgrounds();
  renderTab('activity');
  renderNowPlaying();
  initStats();
}
boot();

</script>
